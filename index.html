<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Karnes en su Jugo | Encuesta</title>

<style>

/* =========================================
   GENERAL
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;
    min-height: 100dvh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #2b150c;

    padding:
        20px 10px 35px;

    position: relative;

    overflow-x: hidden;
}


/* =========================================
   FOTO DE FONDO
========================================= */

body::before {

    content: "";

    position: fixed;

    inset: -35px;

    background-image:
        url("carne en su jugo.jpeg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    filter: blur(7px);

    transform: scale(1.08);

    z-index: -2;
}


/* OSCURECER UN POCO EL FONDO */

body::after {

    content: "";

    position: fixed;

    inset: 0;

    background:
        rgba(30, 12, 5, 0.25);

    z-index: -1;
}


/* =========================================
   CONTENEDOR
========================================= */

.contenedor {

    width: 100%;

    max-width: 500px;

    margin: 0 auto;
}


/* =========================================
   LOGO
========================================= */

.logo-contenedor {

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    padding:
        5px 0 15px;
}


.logo {

    display: block;

    width: 88%;

    max-width: 390px;

    height: auto;

    object-fit: contain;

    filter:
        drop-shadow(
            0 5px 10px
            rgba(0,0,0,.35)
        );
}


/* =========================================
   TARJETA BLANCA
========================================= */

.encuesta {

    width: 100%;

    background:
        rgba(255,255,255,.98);

    border-radius: 26px;

    border-top:
        6px solid #c81018;

    padding:
        27px 22px 25px;

    text-align: center;

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.42);
}


/* =========================================
   ENCABEZADO
========================================= */

.titulo {

    margin: 0;

    color: #bd1018;

    font-size: 28px;

    font-weight: 900;

    line-height: 1.05;

    text-transform: uppercase;
}


.subtitulo {

    margin-top: 8px;

    color: #bd1018;

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 5px;

    text-transform: uppercase;
}


.linea {

    width: 88%;

    height: 2px;

    margin:
        20px auto 24px;

    background:
        #c71920;
}


/* =========================================
   PREGUNTAS
========================================= */

.pregunta {

    margin:
        23px 0 11px;

    color: #161824;

    font-size: 19px;

    font-weight: 900;

    line-height: 1.3;
}


/* =========================================
   ESTRELLAS
========================================= */

.estrellas {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 6px;

    margin:
        8px 0 6px;
}


.estrella {

    border: none;

    background: transparent;

    padding: 0;

    font-size: 46px;

    line-height: 1;

    color: #d6d6d6;

    cursor: pointer;

    transition:
        transform .15s,
        color .15s;

    text-shadow:
        0 2px 3px
        rgba(0,0,0,.12);
}


.estrella:hover {

    transform:
        scale(1.10);
}


.estrella.activa {

    color:
        #ffb71b;

    transform:
        scale(1.05);
}


.texto-calificacion {

    min-height: 18px;

    margin-top: 7px;

    color: #777;

    font-size: 13px;

    font-weight: 600;
}


/* =========================================
   CUADROS DE RESPUESTA
========================================= */

textarea {

    display: block;

    width: 100%;

    min-height: 100px;

    padding:
        14px 15px;

    border:
        1.5px solid #cccccc;

    border-radius:
        14px;

    background:
        #ffffff;

    color:
        #222;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;

    line-height: 1.4;

    outline: none;

    resize: vertical;

    transition:
        border .15s,
        box-shadow .15s;
}


textarea:focus {

    border-color:
        #c5111a;

    box-shadow:
        0 0 0 3px
        rgba(197,17,26,.08);
}


textarea::placeholder {

    color: #999;
}


/* =========================================
   BOTÓN ENVIAR
========================================= */

.enviar {

    width: 100%;

    min-height: 57px;

    margin-top: 24px;

    padding:
        14px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            180deg,
            #e5101a,
            #b90811
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 18px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 7px 15px
        rgba(190,0,10,.28);

    transition:
        transform .15s,
        box-shadow .15s;
}


.enviar:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 20px
        rgba(190,0,10,.35);
}


.enviar:active {

    transform:
        translateY(1px);
}


/* =========================================
   PANTALLA DE GRACIAS
========================================= */

.gracias {

    display: none;

    padding:
        40px 10px;
}


.check {

    width: 75px;

    height: 75px;

    margin: 0 auto;

    border-radius: 50%;

    background:
        #c81018;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    font-weight: 900;

    box-shadow:
        0 7px 18px
        rgba(190,0,10,.25);
}


.gracias h2 {

    margin:
        20px 0 8px;

    color:
        #b90d15;

    font-size:
        28px;
}


.gracias p {

    color: #555;

    font-size: 16px;

    line-height: 1.5;
}


/* =========================================
   CELULAR
========================================= */

@media (max-width: 600px) {

    body {

        padding:
            max(12px, env(safe-area-inset-top))
            9px
            max(30px, env(safe-area-inset-bottom));
    }


    body::before {

        inset: -40px;

        background-size: cover;

        background-position: center;

        filter: blur(7px);

        transform:
            scale(1.10);
    }


    .contenedor {

        max-width:
            430px;
    }


    .logo {

        width: 88%;

        max-width:
            340px;
    }


    .logo-contenedor {

        padding:
            4px 0 12px;
    }


    .encuesta {

        padding:
            24px 15px 21px;

        border-radius:
            22px;
    }


    .titulo {

        font-size:
            clamp(
                21px,
                7vw,
                28px
            );
    }


    .subtitulo {

        font-size:
            11px;

        letter-spacing:
            4px;
    }


    .linea {

        margin:
            17px auto 20px;
    }


    .pregunta {

        margin-top:
            20px;

        font-size:
            clamp(
                16px,
                4.8vw,
                19px
            );
    }


    .estrellas {

        gap: 3px;
    }


    .estrella {

        font-size:
            clamp(
                36px,
                11vw,
                46px
            );
    }


    textarea {

        min-height:
            90px;

        padding:
            12px;

        font-size:
            14px;
    }


    .enviar {

        min-height:
            54px;

        margin-top:
            20px;

        font-size:
            16px;
    }

}


/* TELÉFONOS MUY PEQUEÑOS */

@media (max-width: 350px) {

    .encuesta {

        padding-left:
            12px;

        padding-right:
            12px;
    }


    .estrella {

        font-size:
            33px;
    }

}

</style>

</head>


<body>


<div class="contenedor">


    <!-- =================================
         LOGO
    ================================== -->

    <div class="logo-contenedor">

        <img
            src="Imagen de ChatGPT 29 sept 2026, 10_27_08 p.m..png"
            class="logo"
            alt="Karnes en su Jugo">

    </div>



    <!-- =================================
         ENCUESTA
    ================================== -->

    <main class="encuesta">


        <section id="formulario">


            <h1 class="titulo">

                TU OPINIÓN NOS AYUDA

            </h1>


            <div class="subtitulo">

                A SEGUIR MEJORANDO

            </div>


            <div class="linea"></div>



            <!-- =============================
                 PREGUNTA 1
            ============================== -->

            <div class="pregunta">

                1. ¿Cómo fue tu experiencia?

            </div>


            <div class="estrellas">


                <button
                    type="button"
                    class="estrella"
                    data-valor="1"
                    aria-label="1 estrella">

                    ★

                </button>


                <button
                    type="button"
                    class="estrella"
                    data-valor="2"
                    aria-label="2 estrellas">

                    ★

                </button>


                <button
                    type="button"
                    class="estrella"
                    data-valor="3"
                    aria-label="3 estrellas">

                    ★

                </button>


                <button
                    type="button"
                    class="estrella"
                    data-valor="4"
                    aria-label="4 estrellas">

                    ★

                </button>


                <button
                    type="button"
                    class="estrella"
                    data-valor="5"
                    aria-label="5 estrellas">

                    ★

                </button>


            </div>


            <div
                class="texto-calificacion"
                id="textoCalificacion">

                Selecciona una calificación

            </div>



            <!-- =============================
                 PREGUNTA 2
            ============================== -->

            <div class="pregunta">

                2. ¿Qué te gustó más de nuestra comida?

            </div>


            <textarea
                id="respuesta2"
                placeholder="Escribe aquí tu respuesta..."></textarea>



            <!-- =============================
                 PREGUNTA 3
            ============================== -->

            <div class="pregunta">

                3. ¿Qué podemos mejorar?

            </div>


            <textarea
                id="respuesta3"
                placeholder="Escribe aquí tu respuesta..."></textarea>



            <!-- =============================
                 PREGUNTA 4
            ============================== -->

            <div class="pregunta">

                4. ¿Algún comentario adicional?

            </div>


            <textarea
                id="respuesta4"
                placeholder="Escribe aquí tu respuesta..."></textarea>



            <!-- =============================
                 BOTÓN
            ============================== -->

            <button
                type="button"
                class="enviar"
                id="enviar">

                ENVIAR RESEÑA　➤

            </button>


        </section>



        <!-- =================================
             AGRADECIMIENTO
        ================================== -->

        <section
            class="gracias"
            id="gracias">


            <div class="check">

                ✓

            </div>


            <h2>

                ¡Gracias por tu opinión!

            </h2>


            <p>

                Tu comentario nos ayuda
                a seguir mejorando.

            </p>


            <button
                type="button"
                class="enviar"
                onclick="location.reload()">

                NUEVA RESEÑA

            </button>


        </section>


    </main>


</div>



<script>

/* =========================================
   CALIFICACIÓN DE ESTRELLAS
========================================= */

let calificacion = 0;


const estrellas =
    document.querySelectorAll(
        ".estrella"
    );


const nombres = [

    "",

    "Muy mala",

    "Mala",

    "Regular",

    "Muy buena",

    "Excelente"

];


estrellas.forEach(

    function(estrella) {


        estrella.addEventListener(

            "click",

            function() {


                calificacion =
                    Number(
                        this.dataset.valor
                    );


                estrellas.forEach(

                    function(item) {


                        const valor =
                            Number(
                                item.dataset.valor
                            );


                        if (
                            valor <= calificacion
                        ) {


                            item.classList.add(
                                "activa"
                            );


                        }

                        else {


                            item.classList.remove(
                                "activa"
                            );


                        }


                    }

                );


                document.getElementById(
                    "textoCalificacion"
                ).textContent =

                    calificacion +
                    " / 5 · " +
                    nombres[calificacion];


            }

        );


    }

);



/* =========================================
   BOTÓN ENVIAR
   PROTOTIPO - NO ENVÍA INFORMACIÓN
========================================= */

document.getElementById(
    "enviar"
).addEventListener(

    "click",

    function() {


        /* Debe seleccionar estrellas */

        if (
            calificacion === 0
        ) {


            alert(
                "Selecciona una calificación de 1 a 5 estrellas."
            );


            return;

        }



        /* Obtener respuestas */

        const respuesta2 =
            document.getElementById(
                "respuesta2"
            ).value.trim();


        const respuesta3 =
            document.getElementById(
                "respuesta3"
            ).value.trim();


        const respuesta4 =
            document.getElementById(
                "respuesta4"
            ).value.trim();



        /* DATOS DEL PROTOTIPO */

        const datos = {


            calificacion:
                calificacion,


            gustoMas:
                respuesta2,


            mejorar:
                respuesta3,


            comentario:
                respuesta4


        };


        /* Solo se muestran en consola */

        console.log(
            "PROTOTIPO:",
            datos
        );



        /* Ocultar formulario */

        document.getElementById(
            "formulario"
        ).style.display =
            "none";



        /* Mostrar agradecimiento */

        document.getElementById(
            "gracias"
        ).style.display =
            "block";



        /* Subir al inicio */

        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });


    }

);


</script>


</body>
</html>
