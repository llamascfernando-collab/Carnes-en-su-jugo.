<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Karnes en su Jugo | Encuesta</title>

<style>

/* =========================================
   CONFIGURACIÓN GENERAL
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;
    min-height: 100dvh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #1d1d1d;

    background: #2a160d;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px 12px;

    position: relative;

    overflow-x: hidden;
}


/* =========================================
   FOTO ORIGINAL DE FONDO
========================================= */

body::before {

    content: "";

    position: fixed;

    /*
       Se extiende un poco para que
       el blur no deje bordes.
    */

    inset: -25px;

    background-image:
        url("carne en su jugo.jpeg");

    background-size: cover;

    background-position: center center;

    background-repeat: no-repeat;

    filter: blur(7px);

    transform: scale(1.06);

    z-index: -2;
}


/* =========================================
   CAPA OSCURA SOBRE LA FOTO
========================================= */

body::after {

    content: "";

    position: fixed;

    inset: 0;

    background:
        rgba(25, 10, 3, 0.24);

    z-index: -1;
}


/* =========================================
   TARJETA BLANCA
========================================= */

.encuesta {

    width: 100%;

    max-width: 500px;

    background:
        rgba(255,255,255,0.97);

    border-radius: 26px;

    padding: 29px 24px;

    text-align: center;

    box-shadow:
        0 18px 55px
        rgba(0,0,0,0.42);

    border:
        1px solid
        rgba(255,255,255,0.80);

    position: relative;

    overflow: hidden;
}


/* =========================================
   DETALLE ROJO SUPERIOR
========================================= */

.encuesta::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 6px;

    background:
        linear-gradient(
            90deg,
            #8d070d,
            #dc111b,
            #8d070d
        );
}


/* =========================================
   ENCABEZADO
========================================= */

.titulo {

    margin:
        5px 0 3px;

    color:
        #99131a;

    font-size:
        28px;

    line-height:
        1.1;

    font-weight:
        900;

    text-transform:
        uppercase;
}


.subtitulo {

    margin:
        7px 0 0;

    color:
        #99131a;

    font-size:
        14px;

    font-weight:
        700;

    letter-spacing:
        4px;

    text-transform:
        uppercase;
}


.linea {

    width:
        85%;

    height:
        2px;

    background:
        #b8141c;

    margin:
        17px auto 22px;
}


/* =========================================
   PREGUNTAS
========================================= */

.pregunta {

    margin:
        20px 0 10px;

    color:
        #151515;

    font-size:
        19px;

    font-weight:
        800;
}


/* =========================================
   ESTRELLAS
========================================= */

.estrellas {

    width:
        100%;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    gap:
        5px;

    margin:
        7px 0 5px;
}


.estrella {

    appearance:
        none;

    -webkit-appearance:
        none;

    border:
        none;

    outline:
        none;

    background:
        transparent;

    padding:
        0;

    color:
        #d7d7d7;

    font-size:
        45px;

    line-height:
        1;

    cursor:
        pointer;

    transition:
        transform .15s ease,
        color .15s ease;

    text-shadow:
        0 2px 3px
        rgba(0,0,0,0.12);
}


.estrella:hover {

    transform:
        scale(1.10);
}


.estrella.activa {

    color:
        #ffb900;

    transform:
        scale(1.05);
}


.texto-calificacion {

    min-height:
        19px;

    margin-top:
        7px;

    color:
        #777;

    font-size:
        13px;

    font-weight:
        600;
}


/* =========================================
   OPCIONES
========================================= */

.opciones {

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        10px;

    width:
        100%;

    margin-top:
        12px;
}


.opcion {

    appearance:
        none;

    -webkit-appearance:
        none;

    width:
        100%;

    min-height:
        62px;

    border:
        1.5px solid #dedede;

    border-radius:
        13px;

    background:
        #ffffff;

    padding:
        9px;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    color:
        #222;

    font-family:
        inherit;

    font-size:
        14px;

    font-weight:
        700;

    text-align:
        left;

    cursor:
        pointer;

    transition:
        background .15s,
        border .15s,
        color .15s,
        transform .15s;
}


.opcion:hover {

    border-color:
        #bd1119;

    transform:
        translateY(-1px);
}


.opcion.activa {

    border-color:
        #c50c15;

    background:
        #fff0f1;

    color:
        #a20911;
}


/* =========================================
   ICONOS
========================================= */

.icono {

    width:
        36px;

    height:
        36px;

    min-width:
        36px;

    border-radius:
        50%;

    background:
        linear-gradient(
            145deg,
            #e10b16,
            #a80008
        );

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        white;

    font-size:
        17px;

    font-weight:
        900;

    box-shadow:
        0 3px 7px
        rgba(180,0,10,0.20);
}


/* =========================================
   COMENTARIO
========================================= */

textarea {

    display:
        block;

    width:
        100%;

    min-height:
        110px;

    padding:
        14px;

    border:
        1.5px solid #d3d3d3;

    border-radius:
        13px;

    background:
        #fff;

    color:
        #222;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        15px;

    line-height:
        1.4;

    resize:
        vertical;

    outline:
        none;

    transition:
        border .15s,
        box-shadow .15s;
}


textarea:focus {

    border-color:
        #bd1019;

    box-shadow:
        0 0 0 3px
        rgba(190,15,25,0.08);
}


textarea::placeholder {

    color:
        #999;
}


/* =========================================
   BOTÓN ENVIAR
========================================= */

.enviar {

    appearance:
        none;

    -webkit-appearance:
        none;

    width:
        100%;

    min-height:
        54px;

    margin-top:
        17px;

    padding:
        14px 15px;

    border:
        none;

    border-radius:
        14px;

    background:
        linear-gradient(
            180deg,
            #e20d18 0%,
            #a3060d 100%
        );

    color:
        white;

    font-family:
        inherit;

    font-size:
        17px;

    font-weight:
        900;

    cursor:
        pointer;

    box-shadow:
        0 6px 15px
        rgba(170,0,10,0.30);

    transition:
        transform .15s,
        box-shadow .15s;
}


.enviar:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 9px 18px
        rgba(170,0,10,0.35);
}


.enviar:active {

    transform:
        translateY(1px);
}


/* =========================================
   TEXTO INFERIOR
========================================= */

.nota {

    margin:
        16px 0 0;

    color:
        #888;

    font-size:
        12px;
}


/* =========================================
   PANTALLA DE AGRADECIMIENTO
========================================= */

.gracias {

    display:
        none;

    padding:
        35px 8px;
}


.check {

    width:
        74px;

    height:
        74px;

    margin:
        0 auto;

    border-radius:
        50%;

    background:
        linear-gradient(
            145deg,
            #df0c16,
            #98050c
        );

    color:
        white;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    font-size:
        42px;

    font-weight:
        900;

    box-shadow:
        0 8px 20px
        rgba(170,0,10,.25);
}


.gracias h2 {

    margin:
        18px 0 8px;

    color:
        #a30810;

    font-size:
        27px;
}


.gracias p {

    margin:
        0 auto 20px;

    max-width:
        330px;

    color:
        #555;

    line-height:
        1.5;
}


/* =========================================
   TABLETS
========================================= */

@media (max-width: 700px) {

    body {

        align-items:
            flex-start;

        padding:
            18px 11px 30px;
    }


    body::before {

        /*
           Fondo vertical adaptado
           al teléfono.
        */

        background-position:
            center center;

        filter:
            blur(7px);

        transform:
            scale(1.08);
    }


    .encuesta {

        max-width:
            460px;

        padding:
            26px 20px;

        border-radius:
            23px;
    }

}


/* =========================================
   TELÉFONOS
========================================= */

@media (max-width: 500px) {

    body {

        padding:
            max(12px, env(safe-area-inset-top))
            9px
            max(25px, env(safe-area-inset-bottom));
    }


    body::before {

        /*
           La imagen llena completamente
           la pantalla del teléfono.
        */

        inset:
            -30px;

        background-size:
            cover;

        background-position:
            center center;

        filter:
            blur(6px);

        transform:
            scale(1.08);
    }


    body::after {

        background:
            rgba(25,10,3,0.20);
    }


    .encuesta {

        width:
            100%;

        max-width:
            430px;

        padding:
            23px 15px 21px;

        border-radius:
            21px;

        box-shadow:
            0 13px 35px
            rgba(0,0,0,0.38);
    }


    .titulo {

        margin-top:
            5px;

        font-size:
            clamp(
                21px,
                6.3vw,
                27px
            );
    }


    .subtitulo {

        font-size:
            11px;

        letter-spacing:
            3px;
    }


    .linea {

        margin:
            14px auto 18px;
    }


    .pregunta {

        margin:
            17px 0 9px;

        font-size:
            17px;
    }


    .estrellas {

        gap:
            2px;
    }


    .estrella {

        font-size:
            clamp(
                36px,
                10.5vw,
                44px
            );
    }


    .opciones {

        gap:
            8px;
    }


    .opcion {

        min-height:
            57px;

        padding:
            7px;

        gap:
            7px;

        border-radius:
            11px;

        font-size:
            12.5px;
    }


    .icono {

        width:
            31px;

        height:
            31px;

        min-width:
            31px;

        font-size:
            14px;
    }


    textarea {

        min-height:
            90px;

        padding:
            12px;

        font-size:
            14px;
    }


    .enviar {

        min-height:
            51px;

        margin-top:
            14px;

        font-size:
            15px;

        border-radius:
            12px;
    }


    .nota {

        margin-top:
            13px;
    }

}


/* =========================================
   TELÉFONOS MUY PEQUEÑOS
========================================= */

@media (max-width: 350px) {

    .encuesta {

        padding-left:
            13px;

        padding-right:
            13px;
    }


    .opciones {

        grid-template-columns:
            1fr;
    }


    .estrella {

        font-size:
            34px;
    }

}

</style>

</head>


<body>


<main class="encuesta">


<!-- =====================================
     FORMULARIO
===================================== -->

<section id="formulario">


<h1 class="titulo">

TU OPINIÓN NOS AYUDA

</h1>


<div class="subtitulo">

A SEGUIR MEJORANDO

</div>


<div class="linea"></div>



<!-- =====================================
     CALIFICACIÓN
===================================== -->

<div class="pregunta">

¿Cómo fue tu experiencia?

</div>


<div class="estrellas">


<button
type="button"
class="estrella"
data-valor="1"
aria-label="1 estrella">

★

</button>


<button
type="button"
class="estrella"
data-valor="2"
aria-label="2 estrellas">

★

</button>


<button
type="button"
class="estrella"
data-valor="3"
aria-label="3 estrellas">

★

</button>


<button
type="button"
class="estrella"
data-valor="4"
aria-label="4 estrellas">

★

</button>


<button
type="button"
class="estrella"
data-valor="5"
aria-label="5 estrellas">

★

</button>


</div>


<div
class="texto-calificacion"
id="textoCalificacion">

Selecciona una calificación

</div>



<!-- =====================================
     MOTIVOS
===================================== -->

<div class="pregunta">

¿Qué quieres destacar?

</div>


<div class="opciones">


<button
type="button"
class="opcion"
data-nombre="Sabor">

<span class="icono">
🥩
</span>

<span>
Sabor
</span>

</button>



<button
type="button"
class="opcion"
data-nombre="Servicio">

<span class="icono">
●
</span>

<span>
Servicio
</span>

</button>



<button
type="button"
class="opcion"
data-nombre="Tiempo de espera">

<span class="icono">
◷
</span>

<span>
Tiempo de espera
</span>

</button>



<button
type="button"
class="opcion"
data-nombre="Limpieza">

<span class="icono">
✦
</span>

<span>
Limpieza
</span>

</button>



<button
type="button"
class="opcion"
data-nombre="Porciones">

<span class="icono">
🍴
</span>

<span>
Porciones
</span>

</button>



<button
type="button"
class="opcion"
data-nombre="Precio">

<span class="icono">
$
</span>

<span>
Precio
</span>

</button>


</div>



<!-- =====================================
     COMENTARIO
===================================== -->

<div class="pregunta">

Cuéntanos un poco más

</div>


<textarea
id="comentario"
placeholder="Escribe aquí tu comentario..."></textarea>



<!-- =====================================
     BOTÓN
===================================== -->

<button
type="button"
class="enviar"
id="enviar">

ENVIAR RESEÑA ✈

</button>


<p class="nota">

¡Gracias por ayudarnos a mejorar!

</p>


</section>



<!-- =====================================
     MENSAJE FINAL
===================================== -->

<section
class="gracias"
id="gracias">


<div class="check">

✓

</div>


<h2>

¡Gracias por tu opinión!

</h2>


<p>

Tu comentario nos ayuda
a mejorar cada visita.

</p>


<button
type="button"
class="enviar"
onclick="location.reload()">

NUEVA RESEÑA

</button>


</section>


</main>



<script>

/* =====================================
   CALIFICACIÓN
===================================== */

let calificacion = 0;


const estrellas =
document.querySelectorAll(
    ".estrella"
);


const nombres = [

    "",

    "Muy mala",

    "Mala",

    "Regular",

    "Muy buena",

    "Excelente"

];


estrellas.forEach(

function(estrella) {


    estrella.addEventListener(

    "click",

    function() {


        calificacion =
        Number(
            this.dataset.valor
        );


        estrellas.forEach(

        function(item) {


            const valor =
            Number(
                item.dataset.valor
            );


            if(
                valor <=
                calificacion
            ) {


                item.classList.add(
                    "activa"
                );


            }

            else {


                item.classList.remove(
                    "activa"
                );


            }


        });


        document.getElementById(
            "textoCalificacion"
        ).textContent =

            calificacion +
            " / 5 · " +
            nombres[calificacion];


    });


});



/* =====================================
   OPCIONES
===================================== */

const opciones =
document.querySelectorAll(
    ".opcion"
);


opciones.forEach(

function(opcion) {


    opcion.addEventListener(

    "click",

    function() {


        this.classList.toggle(
            "activa"
        );


    });


});



/* =====================================
   ENVIAR
===================================== */

document.getElementById(
    "enviar"
).addEventListener(

"click",

function() {


    /* Comprobar calificación */


    if(
        calificacion === 0
    ) {


        alert(
            "Selecciona de 1 a 5 estrellas."
        );


        return;

    }



    /* Obtener opciones */


    const motivos = [];


    document.querySelectorAll(
        ".opcion.activa"
    ).forEach(

    function(opcion) {


        motivos.push(
            opcion.dataset.nombre
        );


    });



    /* Obtener comentario */


    const comentario =
    document.getElementById(
        "comentario"
    ).value;



    /* Datos de la encuesta */


    const datos = {


        calificacion:
            calificacion,


        motivos:
            motivos,


        comentario:
            comentario


    };


    console.log(
        "Encuesta:",
        datos
    );



    /* Ocultar formulario */


    document.getElementById(
        "formulario"
    ).style.display =
        "none";



    /* Mostrar agradecimiento */


    document.getElementById(
        "gracias"
    ).style.display =
        "block";


});


</script>


</body>

</html>
